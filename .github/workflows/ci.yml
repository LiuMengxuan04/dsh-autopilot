name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_VERSION: 0.1.0-rc.6
  PNPM_VERSION: 11.7.0

jobs:
  quality:
    name: Quality / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24.x']
    defaults:
      run:
        working-directory: dsh-autopilot
    steps:
      - name: Check out DSH Autopilot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: dsh-autopilot

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: dsh-autopilot/pnpm-lock.yaml

      - name: Verify registry DSH pin
        run: test "$(npm view "@deepseek-ai/dsh@${DSH_VERSION}" version)" = "${DSH_VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate capability inventory
        run: pnpm run capabilities:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit coverage
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

  package-e2e:
    name: Packed DSH Web E2E / system Edge / Node 24
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: dsh-autopilot
    steps:
      - name: Check out DSH Autopilot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: dsh-autopilot

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: dsh-autopilot/pnpm-lock.yaml

      - name: Verify registry DSH pin
        run: test "$(npm view "@deepseek-ai/dsh@${DSH_VERSION}" version)" = "${DSH_VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify system Microsoft Edge
        run: microsoft-edge --version

      - name: Prepare DSH bubblewrap sandbox
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -yq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            || echo 'apparmor userns knob absent — the functional probe decides'
          bwrap --version
          bwrap --ro-bind / / --dev /dev --proc /proc --die-with-parent -- true

      - name: Build package
        run: pnpm run build

      - name: Validate published API
        run: pnpm exec publint

      - name: Validate tarball contents
        shell: bash
        run: |
          pnpm pack --pack-destination .artifacts
          tarball="$(find .artifacts -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$tarball"
          entries="$(tar -tzf "$tarball")"
          printf '%s\n' "$entries"
          printf '%s\n' "$entries" | grep -Eq '^package/cordis.patch.yml$'
          printf '%s\n' "$entries" | grep -Eq '^package/lib/service.js$'
          printf '%s\n' "$entries" | grep -Eq '^package/lib/skills.js$'
          printf '%s\n' "$entries" | grep -Eq '^package/assets/skills/autonomous-development/SKILL.md$'
          printf '%s\n' "$entries" | grep -Eq '^package/README.md$'
          printf '%s\n' "$entries" | grep -Eq '^package/README.zh-CN.md$'
          printf '%s\n' "$entries" | grep -Eq '^package/docs/autonomy-and-security.md$'
          if printf '%s\n' "$entries" | grep -Eq '^package/(src|tests)/|\.map$'; then
            echo 'tarball contains source, tests, or source maps' >&2
            exit 1
          fi

      - name: Run packed browser E2E
        run: pnpm run test:e2e
        env:
          DSH_AUTOPILOT_E2E_BROWSER_CHANNEL: msedge
