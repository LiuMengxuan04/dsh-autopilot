- insert:
    - id: dsh-autopilot-service
      name: '@liumengxuan04/dsh-autopilot/service'
      config:
        defaultMaxGoalRounds: 256
        maxGoalRounds: 1024
        defaultMaxActiveMs: 604800000
        maxActiveMs: 2592000000
        maxVerificationAttempts: 3
        maxDynamicPackages: 8
        selfModification: host-only

    - id: dsh-autopilot-commands
      name: '@liumengxuan04/dsh-autopilot/commands'

    - id: dsh-autopilot-tools
      name: '@liumengxuan04/dsh-autopilot/tools'
      config:
        minimumEvidenceItems: 1
        checks:
          - name: git-diff
            command: git diff --check
            timeoutMs: 120000

    - id: dsh-autopilot-skills
      name: '@liumengxuan04/dsh-autopilot/skills'
